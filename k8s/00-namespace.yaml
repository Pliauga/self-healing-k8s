---
apiVersion: v1
kind: Namespace
metadata:
  name: selfhealing
  labels:
    app.kubernetes.io/part-of: self-healing-cluster
    app.kubernetes.io/managed-by: kubectl
    # Enforce the restricted Pod Security Standard: workload manifests below
    # are written to comply (no root, no privilege escalation, dropped caps).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted