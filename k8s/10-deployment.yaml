---
# Target workload for the self-healing demo.
#
# The image is built locally from ../app (a Flask application served by
# gunicorn with 4 workers, implementing the health, metrics and fault-injection
# endpoints the demo needs). scripts/setup.sh builds it into minikube's image
# store, which is why imagePullPolicy is IfNotPresent and the tag is fixed
# at :dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: self-healing-cluster
spec:
  replicas: 3
  revisionHistoryLimit: 5
  # Require a replacement pod to be Ready for this many seconds before the
  # rollout proceeds. This is a *Deployment* field (spec.minReadySeconds), not a
  # pod field - placing it under spec.template.spec is rejected by the API
  # server with a strict-decoding error.
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired replica count during a rollout.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: self-healing-cluster
      annotations:
        # Consumed by the Prometheus scrape config when the ServiceMonitor CRD
        # is not installed (see k8s/optional/observability/servicemonitor.yaml
        # for the CRD-based path).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure cannot take the
      # whole workload down - the cheapest form of self-healing there is.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-api
      containers:
        - name: api
          image: selfhealing/demo-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # gunicorn runs 4 workers, so the fault flag injected by /fail must
            # be shared between them. It is written to a file on a shared
            # emptyDir rather than held in process memory; see app/app.py.
            - name: FAULT_STATE_FILE
              value: /var/run/demo-api/fault.json
          volumeMounts:
            - name: fault-state
              mountPath: /var/run/demo-api
          resources:
            # Requests drive both scheduling and the HPA's CPU utilisation
            # calculation. Without a CPU request the HPA cannot compute a
            # percentage and will report <unknown>.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # Deliberately tight CPU limit: this is what makes the load
              # generator's traffic throttle the container and push CPU
              # utilisation above the HPA target.
              cpu: 500m
              memory: 256Mi
          # --- Liveness: "is this container wedged? restart it." -------------
          # Slower and more forgiving than readiness. At periodSeconds 10 with
          # failureThreshold 3, a wedged container is restarted after ~30s.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # --- Readiness: "should this pod receive traffic right now?" -------
          # Fast and tight: fails within ~10s and pulls the pod out of the
          # Service endpoints without restarting the container.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          # --- Startup: shields a slow boot from the liveness probe ----------
          # Allows up to 24 * 5s = 120s of startup before liveness applies.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        # Shared by the gunicorn workers within a single pod, so a fault set by
        # one worker is visible to them all - without this, /fail is unreliable
        # with 4 workers.
        #
        # emptyDir is ephemeral per POD, not per CONTAINER: this volume survives
        # a container restart. The app therefore clears the fault file at
        # startup, so liveness remediation genuinely heals the pod. See
        # docs/design.md section 4.1.
        - name: fault-state
          emptyDir: {}