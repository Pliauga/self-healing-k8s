---
# Tier 2 remediation agent: the Alertmanager webhook receiver that diagnoses a
# fault and, for a validated diagnosis above the confidence gate, performs at
# most one mutation.
#
# The image is built locally from ../app/agent (a Flask application served by
# gunicorn with a SINGLE sync worker, so that concurrent webhooks cannot race
# the executor into more than one eviction). scripts do not build it yet:
#   minikube image build -p selfhealing -t selfhealing/demo-agent:dev app/agent/
# As with demo-api, the image lives in minikube's image store, so
# imagePullPolicy is IfNotPresent and the tag is fixed at :dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-agent
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: demo-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: self-healing-cluster
spec:
  # Exactly one replica, deliberately.
  #
  # diagnosis.py runs gunicorn with --workers 1: the executor performs at most
  # one mutation per request, and a second worker would let two diagnoses act
  # on the same fault concurrently. More replicas would multiply the agent's
  # authority without adding correctness - Alertmanager delivers to one
  # endpoint, and the executor's own guards are the safety property, not
  # redundancy here.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A single-replica agent has no surge budget to hide behind, so the old
      # pod must stay up until the new one is Ready. maxUnavailable: 0 with
      # maxSurge: 1 means the replacement is created first.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: self-healing-cluster
    spec:
      # The agent is the ONLY component in this namespace holding a mutating
      # permission, and it holds it here: ADR-0006 binds one ServiceAccount,
      # `remediation-agent`, to one Role granting create on
      # policy/pods/eviction - and deliberately NOT delete on pods (ADR-0005).
      # Without this ServiceAccount the pod would sit in
      # CreateContainerConfigError; the Role is applied by
      # scripts/apply.sh --optional, not by this manifest.
      serviceAccountName: remediation-agent
      # gunicorn's --graceful-timeout is 60s, so a SIGTERM must be given more
      # than 60s to let an in-flight diagnosis finish. The default (30) would
      # SIGKILL the worker mid-eviction - the one moment the agent must not be
      # interrupted.
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: selfhealing/demo-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The LLM API key is read from the environment at call time
            # (dsh_client.API_KEY_ENV) and is NEVER written into a tracked
            # file. It is injected here from a Secret created out-of-band:
            #   kubectl create secret generic token-harbor-api-key \
            #     -n selfhealing --from-literal=TOKEN_HARBOR_API_KEY='...'
            # secretKeyRef rather than envFrom: naming the exact key means a
            # Secret missing that key fails the pod loudly instead of starting
            # an agent whose every diagnosis silently escalates.
            - name: TOKEN_HARBOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: token-harbor-api-key
                  key: TOKEN_HARBOR_API_KEY
            # The agent's kubectl evidence reads and eviction writes are
            # scoped to one namespace; NAMESPACE is also the default in
            # diagnosis.py, but stating it here keeps the manifest
            # self-describing.
            - name: NAMESPACE
              value: selfhealing
          resources:
            # Modest: the agent is I/O-bound (kubectl reads + one HTTP call to
            # the LLM) and holds no metrics of its own.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # --- Liveness: "is the agent wedged?" ------------------------------
          # Deliberately SLACK, and unlike demo-api's ~30s restart window.
          #
          # gunicorn runs ONE sync worker, so while a slow diagnosis is in
          # flight that worker cannot answer /healthz at all. The worst case
          # is ~123s (three 30s LLM attempts + backoff + three 10s kubectl
          # reads), and gunicorn's own --timeout is 150s. A probe that failed
          # in ~30s would restart the agent in the middle of the incident it
          # exists to handle, aborting the eviction. 15s * 12 = 180s of
          # tolerance, which sits above gunicorn's 150s limit: if the worker
          # is genuinely dead gunicorn kills the request first, and a probe
          # failure then means the process is wedged rather than merely busy.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
            successThreshold: 1
          # --- Readiness: "should Alertmanager deliver here right now?" ------
          # diagnosis.py exposes only /healthz and /alert, so readiness must
          # reuse /healthz. That is acceptable for a single replica with one
          # delivery endpoint: there is no load-balancer fan-out to protect,
          # and a readiness probe that tracked the LLM would pull the pod out
          # of the Service while it was merely slow. /healthz is deliberately
          # independent of kubectl and the LLM for exactly this reason.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
