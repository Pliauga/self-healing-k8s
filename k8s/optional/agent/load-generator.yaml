---
# Load generator: drives CPU utilisation so the HPA has something to react to.
#
# It loops on /burn against the demo-api Service. 8 concurrent workers, each
# burning 2s of CPU per iteration, is enough to push three 500m-limited
# replicas well past the 70% HPA target on a laptop-sized minikube node.
#
# Scale it to zero (kubectl scale deploy/load-generator -n selfhealing
# --replicas=0) to make the HPA scale back down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: testing
    app.kubernetes.io/part-of: self-healing-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/component: testing
        app.kubernetes.io/part-of: self-healing-cluster
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: curlimages/curl:8.11.1
          # Explicitly avoid `latest`: a silent upstream change would make
          # load-test results non-reproducible.
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET
              value: "http://demo-api.selfhealing.svc.cluster.local/echo"
            - name: BURN_URL
              value: "http://demo-api.selfhealing.svc.cluster.local/burn?seconds=2"
            - name: CONCURRENCY
              value: "8"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "load-generator: target=${TARGET} concurrency=${CONCURRENCY}"
              i=0
              while [ "$i" -lt "$CONCURRENCY" ]; do
                (
                  while true; do
                    curl -sS -o /dev/null --max-time 10 "$BURN_URL" || true
                  done
                ) &
                i=$((i + 1))
              done
              # Keep the foreground busy so the container does not exit and
              # restart-loop; also exercises the plain request path.
              while true; do
                curl -sS -o /dev/null --max-time 10 "$TARGET" || true
                sleep 1
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL