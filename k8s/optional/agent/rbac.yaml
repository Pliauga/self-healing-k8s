---
# RBAC for the self-healing remediation agent.
#
# ONE ServiceAccount, ONE Role, ONE RoleBinding. Read this header before
# "fixing" it back into the two-identity shape described in ADR-0003.
#
# WHY ONE IDENTITY AND NOT TWO (ADR-0006):
# ADR-0003 specified an RBAC split across a hard PROCESS boundary: a read-only
# diagnosis identity and a write-minimal executor identity, with deliberately
# non-overlapping grants so that neither could both learn and act. That is the
# right shape for two pods. It cannot be instantiated in one.
#
#   * Tier 2 runs both responsibilities in a single Flask container, so the
#     split would not be a process boundary, only a file boundary.
#   * A pod presents exactly ONE ServiceAccount token. Kubernetes mounts a
#     single token at /var/run/secrets/kubernetes.io/serviceaccount. One process
#     therefore has one identity, and "the two grants do not overlap" is a
#     property of two identities that has nothing to attach to.
#
# So this file describes the boundary that actually exists: the code. The safety
# property ADR-0003 exists to protect - the LLM cannot express an action outside
# the closed vocabulary - is enforced in `app/agent/executor.py`, which derives
# the allowed set from the `Action` literal in `app/agent/schema.py` and rejects
# anything else before it can call the API.
#
# WHAT IS GENUINELY LOST, stated plainly: with the split, a compromised
# diagnosis workload could do no more than read the namespace. Here a
# compromised agent pod can read AND evict. The blast radius is bounded by the
# PodDisruptionBudget - the worst case is one budget-checked eviction, refused
# with 429 TooManyRequests when the budget is exhausted - but it is larger than
# the two-identity design's worst case. ADR-0006 records this as an accepted
# cost, and its reversal condition is a real split into two pods.
#
# Deliberately NOT granted:
#   * delete on pods          - bypasses the PDB and races the ReplicaSet
#                               (ADR-0005). The eviction grant below is the
#                               whole of the mutating surface.
#   * patch on deployments    - not one of the four closed remedies. ADR-0003
#                               fixes the vocabulary restart-pod, scale-up,
#                               investigate, escalate; every one is expressible
#                               with the grants here. `patch deployments` is
#                               arbitrary mutation of a workload spec, strictly
#                               broader than any listed remedy, so granting it
#                               would make the allowlist a bound on what the
#                               agent usually does rather than on what it can do.
#   * create/patch on nodes   - cordoning and draining stay a human decision
#   * anything cluster-scoped - the Role is namespaced to `selfhealing`
#   * secrets                 - an agent that can read secrets is a
#                               lateral-movement risk
#
# Note: eviction and poddisruptionbudgets are in the `policy` API group, not the
# core group. `kubectl auth can-i` cannot express a subresource and will answer
# `no` for the eviction grant - that is a client limitation, not a missing
# permission (ADR-0005). Verify with a SubjectAccessReview naming group `policy`.
#
# The ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-agent
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: remediation-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: self-healing-cluster
# Required: the agent calls the read API for diagnosis evidence and the eviction
# subresource to act. Without a mounted token every kubectl call is anonymous.
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-agent
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: remediation-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: self-healing-cluster
rules:
  # --- Reads: what the diagnosis stage needs to build evidence ---------------
  # Observe the workloads the agent may reason about, and the events that
  # explain why they are unhealthy.
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Read pod logs so a diagnosis can attach evidence to its proposal.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Identify the ReplicaSet/Deployment that owns a pod, so `target` in the
  # diagnosis JSON names a real owner rather than a pod about to disappear.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

  # --- Reads: what the EXECUTOR needs before it may act ---------------------
  # These two grants are the reason this file was rewritten. The executor
  # performs two reads before it will mutate anything, and without them it
  # cannot tell a refusal from a fact:
  #
  #   get pods                  the mandatory re-check (docs/design.md §6.2):
  #                             has the cluster healed since the alert fired?
  #                             Without this, a 403 is indistinguishable from a
  #                             404 at the call site, and the executor reports
  #                             "already healed" for a pod it was never
  #                             authorized to look at - a false success, the
  #                             exact shape of finding 2 in §14.
  #   get poddisruptionbudgets  the budget gate, so a refusal we can see coming
  #                             is a back-off rather than an error rate.
  #
  # The executor treats a read it cannot complete as INDETERMINATE and
  # escalates; it never reads an unverifiable answer as permission.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]

  # --- The only mutating permission in this file ----------------------------
  # DO NOT "helpfully" add `delete` on pods here.
  #
  # ADR-0005: a plain pod DELETE bypasses the PodDisruptionBudget entirely, so an
  # agent deleting in a loop can drain an entire replica set - and it will do so
  # precisely when the workload is already degraded and the budget is most
  # needed. A remediation action must not be able to cause the outage it exists
  # to prevent. Deletion is also racy against the ReplicaSet controller, which
  # may create a replacement while the deletion is still propagating.
  #
  # The eviction subresource instead routes through the API server's admission
  # path, which enforces the budget and returns 429 TooManyRequests when it is
  # exhausted. The executor treats 429 as "back off and escalate", never as a
  # reason to reach for a stronger verb. The RBAC gap makes the unsafe operation
  # unavailable rather than merely discouraged.
  #
  # Spelling matters: `policy` group, `pods/eviction` resource, `create` verb.
  # The core "" group does not carry eviction, and granting `create` on plain
  # `pods` would be a different (and wrong) permission.
  - apiGroups: ["policy"]
    resources: ["pods/eviction"]
    verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-agent
  namespace: selfhealing
  labels:
    app.kubernetes.io/name: remediation-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: self-healing-cluster
subjects:
  # One subject: the single identity the agent pod runs as. In the superseded
  # two-identity design this binding named the executor alone and the diagnosis
  # ServiceAccount was deliberately absent, which is what made "the component
  # that decides cannot itself act" true in RBAC. With one container there is one
  # token, so that sentence is now enforced by executor.py instead - see the
  # header above and ADR-0006.
  - kind: ServiceAccount
    name: remediation-agent
    namespace: selfhealing
roleRef:
  kind: Role
  name: remediation-agent
  apiGroup: rbac.authorization.k8s.io
